<h2>By Capital</h2>
<hr />

<div class="row">
  <div class="col">
    <!-- SearchBox -->
    <shared-search-box
      (onValue)="searchByCapital($event)"
      (onDebounce)="searchByCapital($event)"
      placeholder="Search by capital"
      [initialValue]="term"
    ></shared-search-box>
  </div>
</div>
<hr />
<div class="row">
  <div class="col">
    @if (isLoading) {
    <shared-loading-spinner></shared-loading-spinner>
    }
    <ul>
      <countries-country-table
        [countries]="countries"
      ></countries-country-table>
    </ul>
  </div>
</div>
