<h2>By Cuntry</h2>
<hr />

<div class="row">
  <div class="col text-center">
    <!-- SearchBox -->
    @for (region of regions; track $index) {
    <button
      class="btn mx-2"
      (click)="searchByRegion(region)"
      [ngClass]="{ 'btn-outline-primary': selectedRegion === region }"
    >
      {{ region }}
    </button>
    }
  </div>
</div>
<hr />
<div class="row">
  <div class="col">
    <ul>
      @if (isLoading) {
      <shared-loading-spinner></shared-loading-spinner>
      }
      <countries-country-table
        [countries]="countries"
      ></countries-country-table>
    </ul>
  </div>
</div>
